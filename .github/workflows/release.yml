name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          if [ "v$(node -p "require('./package.json').version")" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check && npm run build
      - run: npx vitest run test/client.test.ts test/errors.test.ts test/index.test.ts test/resilience.test.ts
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
